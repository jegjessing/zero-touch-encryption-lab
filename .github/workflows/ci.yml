  #   # wait timers) and a place to scope the deploy secrets to.
  #   environment: production
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     # Point kubectl at the real cluster. KUBE_CONFIG is a repo/environment
  #     # secret holding a base64-encoded kubeconfig for a deploy service account
  #     # (least privilege — only what it needs in the zerotouch-lab namespace).
